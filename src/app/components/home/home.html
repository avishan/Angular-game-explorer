<div class="home-container">

  <div class="filters">
    <mat-form-field appearance="fill">
      <mat-label>Sort</mat-label>

      <mat-select panelClass="sort-select" [(ngModel)]="sort" (selectionChange)="sortGames()">
        <mat-option value="name">Name</mat-option>
        <mat-option value="-released">Released</mat-option>
        <mat-option value="-added">Added</mat-option>
        <mat-option value="-created">Created</mat-option>
        <mat-option value="-updated">Updated</mat-option>
        <mat-option value="-rating">Rating</mat-option>
        <mat-option value="metacritic">Metacritic</mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <div class="games-grid">

    @for (game of games; track game.name) {
      <div class="game-card">
        <img src="https://via.placeholder.com/250x320" alt="game">

        <h3>{{ game.name }}</h3>
        <p>⭐ {{ game.rating }}</p>
        <p>Released: {{ game.year }}</p>
      </div>
    }

  </div>

</div>
